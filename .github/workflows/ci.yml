name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install dependencies
        run: python -m pip install -e ".[dev]"
      - name: Run Ruff
        run: ruff check .

  types:
    name: Types
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install dependencies
        run: python -m pip install -e ".[dev]"
      - name: Run MyPy
        run: mypy src

  tests:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      APP_ENV: test
      DATABASE_URL: postgresql+asyncpg://triagem:triagem@localhost:5432/triagem_ci
      TEST_DATABASE_URL: postgresql+asyncpg://triagem:triagem@localhost:5432/triagem_ci
      REDIS_URL: redis://localhost:6379/0
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: triagem_ci
          POSTGRES_USER: triagem
          POSTGRES_PASSWORD: triagem
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U triagem -d triagem_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install dependencies
        run: python -m pip install -e ".[dev]"
      - name: Apply migrations
        run: alembic upgrade head
      - name: Run test suite
        run: pytest

  migrations:
    name: Migrations
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      APP_ENV: test
      DATABASE_URL: postgresql+asyncpg://triagem:triagem@localhost:5432/triagem_ci
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: triagem_ci
          POSTGRES_USER: triagem
          POSTGRES_PASSWORD: triagem
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U triagem -d triagem_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install dependencies
        run: python -m pip install -e ".[dev]"
      - name: Apply migrations
        run: alembic upgrade head
      - name: Check model and migration consistency
        run: alembic check

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Build test image
        run: docker build --target test --tag triagem-tickets:ci .
